[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .git,__pycache__,.venv,venv,build,dist,*.egg-info
per-file-ignores =
    frontend/app.py:E402,E501
    frontend/components/security_checklist.py:E501
    frontend/components/shap_chart.py:E501
    frontend/components/risk_gauge.py:E501
    frontend/utils/styling.py:E501

[isort]
profile = black
